[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_USE_NETLIFY_EDGE = "true"

# Note: You must set your GEMINI_API_KEY in the Netlify UI 
# under Site Settings > Environment Variables for GenAI features to work.